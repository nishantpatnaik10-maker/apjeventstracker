<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APJ DemoX Events Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .month-nav button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .month-nav button:hover {
            background: #764ba2;
        }

        .month-year {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            min-width: 200px;
            text-align: center;
        }

        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .calendar {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .calendar thead {
            background: #f8f9fa;
        }

        .calendar th {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .calendar td {
            padding: 0;
            border: 1px solid #e0e0e0;
            height: 120px;
            vertical-align: top;
            background: white;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .calendar td:hover {
            background: #f8f9fa;
        }

        .calendar td.other-month {
            background: #f8f9fa;
            color: #ccc;
        }

        .date-number {
            padding: 8px;
            font-weight: 600;
            color: #333;
        }

        .date-number.other-month {
            color: #ccc;
        }

        .events-list {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .event {
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 3px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: transform 0.2s;
        }

        .event:hover {
            transform: scale(1.05);
        }

        .event-hands-on { background: #FFB6C1; }
        .event-ai-agentic { background: #98FB98; }
        .event-lunch-learn { background: #FFD700; }
        .event-blueprint-workshop { background: #DDA0DD; }
        .event-gtm-onboarding { background: #FFA500; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .event-detail {
            margin-bottom: 15px;
        }

        .event-detail-label {
            font-weight: 600;
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .event-detail-value {
            color: #333;
            line-height: 1.6;
        }

        .event-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }

        .event-badge-engagement {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .modal-footer {
            text-align: right;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .modal-footer button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .modal-footer button:hover {
            background: #764ba2;
        }

        .emoji {
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .calendar td {
                height: 100px;
                font-size: 12px;
            }

            .date-number {
                padding: 5px;
            }

            .event {
                font-size: 11px;
            }

            .header h1 {
                font-size: 20px;
            }

            .controls {
                flex-direction: column;
            }

            .legend {
                gap: 10px;
            }

            .legend-item {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 APJ DemoX Events Calendar</h1>
            <p>View and manage all upcoming events</p>
        </div>

        <div class="controls">
            <div class="month-nav">
                <button onclick="previousMonth()">← Previous</button>
                <div class="month-year" id="monthYear"></div>
                <button onclick="nextMonth()">Next →</button>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #FFB6C1;"></div>
                <span>🎓 Hands on Experiences</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #98FB98;"></div>
                <span>🤖 AI Agentic Development</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFD700;"></div>
                <span>🥗 Lunch & Learn</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #DDA0DD;"></div>
                <span>🎪 Blueprint Workshops</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFA500;"></div>
                <span>🚀 GTM Onboarding</span>
            </div>
        </div>

        <table class="calendar">
            <thead>
                <tr>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                    <th>Sun</th>
                </tr>
            </thead>
            <tbody id="calendarBody">
            </tbody>
        </table>
    </div>

    <!-- Event Details Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="eventTitle"></div>
                </div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="event-detail">
                    <div class="event-detail-label">Event Type</div>
                    <div class="event-detail-value" id="eventType"></div>
                </div>
                <div class="event-detail">
                    <div class="event-detail-label">Date</div>
                    <div class="event-detail-value" id="eventDate"></div>
                </div>
                <div class="event-detail">
                    <div class="event-detail-label">Description</div>
                    <div class="event-detail-value" id="eventDescription"></div>
                </div>
                <div class="event-detail">
                    <div class="event-detail-label">Engagement</div>
                    <div class="event-detail-value" id="eventEngagement"></div>
                </div>
                <div class="event-detail">
                    <div class="event-detail-label">SA ID</div>
                    <div class="event-detail-value" id="eventSAID"></div>
                </div>
                <div class="event-detail">
                    <div class="event-detail-label">Assignees</div>
                    <div class="event-detail-value" id="eventAssignees"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Sample event data - Replace with your actual data from Google Sheets
        const sampleEvents = [
            {
                id: 1,
                title: "Hands on Experience - Infinity",
                type: "Hands on Experiences",
                date: "2026-09-16",
                description: "Learn the basics of Pega Infinity platform",
                engagement: true,
                sa_id: "O-123456",
                assignees: "John Bai, Katherine Chen"
            },
            {
                id: 2,
                title: "AI Agentic Development",
                type: "AI Assisted Agentic Development",
                date: "2026-09-18",
                description: "Introduction to AI-assisted development techniques",
                engagement: true,
                sa_id: "O-234567",
                assignees: "Ankit Sharma, Nishant Patnaik"
            },
            {
                id: 3,
                title: "Lunch & Learn - Python",
                type: "Lunch and Learns",
                date: "2026-09-19",
                description: "Advanced Python programming patterns",
                engagement: false,
                sa_id: "O-345678",
                assignees: "Masashi Tsuneizumi"
            },
            {
                id: 4,
                title: "Blueprint Workshop",
                type: "Blueprint Workshops",
                date: "2026-09-21",
                description: "Building scalable applications with Blueprint",
                engagement: true,
                sa_id: "O-456789",
                assignees: "Katherine Chen, Yianni Mannias"
            },
            {
                id: 5,
                title: "GTM Onboarding",
                type: "GTM Onboarding",
                date: "2026-09-23",
                description: "Go-To-Market strategy and execution",
                engagement: true,
                sa_id: "O-567890",
                assignees: "John Bai"
            }
        ];

        let currentDate = new Date();
        let events = sampleEvents;

        const eventTypeClasses = {
            "Hands on Experiences": "event-hands-on",
            "AI Assisted Agentic Development": "event-ai-agentic",
            "Lunch and Learns": "event-lunch-learn",
            "Blueprint Workshops": "event-blueprint-workshop",
            "GTM Onboarding": "event-gtm-onboarding"
        };

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month/year display
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            document.getElementById("monthYear").textContent = `${monthNames[month]} ${year}`;

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const calendarBody = document.getElementById("calendarBody");
            calendarBody.innerHTML = "";

            let dayCounter = 1;
            let nextMonthCounter = 1;

            for (let week = 0; week < 6; week++) {
                const row = document.createElement("tr");

                for (let day = 0; day < 7; day++) {
                    const cell = document.createElement("td");
                    const dateDiv = document.createElement("div");
                    dateDiv.className = "date-number";

                    if (week === 0 && day < firstDay) {
                        // Previous month days
                        dateDiv.className += " other-month";
                        dateDiv.textContent = daysInPrevMonth - firstDay + day + 1;
                        cell.className = "other-month";
                    } else if (dayCounter > daysInMonth) {
                        // Next month days
                        dateDiv.className += " other-month";
                        dateDiv.textContent = nextMonthCounter++;
                        cell.className = "other-month";
                    } else {
                        // Current month days
                        dateDiv.textContent = dayCounter;
                        const currentDateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(dayCounter).padStart(2, "0")}`;
                        const dayEvents = events.filter(e => e.date === currentDateStr);

                        if (dayEvents.length > 0) {
                            const eventsList = document.createElement("div");
                            eventsList.className = "events-list";

                            dayEvents.forEach(event => {
                                const eventEl = document.createElement("div");
                                eventEl.className = `event ${eventTypeClasses[event.type] || ""}`;
                                eventEl.textContent = event.title;
                                eventEl.onclick = (e) => {
                                    e.stopPropagation();
                                    showEventDetails(event);
                                };
                                eventsList.appendChild(eventEl);
                            });

                            cell.appendChild(dateDiv);
                            cell.appendChild(eventsList);
                            dayCounter++;
                            row.appendChild(cell);
                            continue;
                        }

                        dayCounter++;
                    }

                    cell.appendChild(dateDiv);
                    row.appendChild(cell);
                }

                calendarBody.appendChild(row);
            }
        }

        function showEventDetails(event) {
            document.getElementById("eventTitle").textContent = event.title;
            document.getElementById("eventType").textContent = event.type;
            document.getElementById("eventDate").textContent = new Date(event.date).toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
            document.getElementById("eventDescription").textContent = event.description;
            document.getElementById("eventEngagement").innerHTML = `<span class="event-badge event-badge-engagement">${event.engagement ? "✓ Yes" : "Not Created"}</span>`;
            document.getElementById("eventSAID").textContent = event.sa_id || "N/A";
            document.getElementById("eventAssignees").textContent = event.assignees || "Not assigned";

            document.getElementById("eventModal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("eventModal").classList.remove("active");
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        // Close modal when clicking outside
        document.getElementById("eventModal").addEventListener("click", function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initial render
        renderCalendar();
    </script>
</body>
</html>
